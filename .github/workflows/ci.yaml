# Quickstart for GitHub Actions
# https://docs.github.com/en/actions/quickstart
name: Fast CI
on:
  workflow_dispatch:

jobs:

  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 26
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-26-arm64
      max-parallel: 64
    name: Fast CI on Java ${{ matrix.java }} OS ${{ matrix.os }} [${{ 
      matrix.expander_leg }}]

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        architecture: ${{ matrix.jdk_arch || matrix.arch }}
        distribution: zulu
        cache: maven
    - run: ./mvnw -V --no-transfer-progress clean package
